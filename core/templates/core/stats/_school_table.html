<div class="col-lg-6 mb-3">
    <div class="card shadow-sm border-0 h-100">
        <div class="card-header bg-white border-bottom">
            <h6 class="mb-0 font-weight-bold">{{ title }}</h6>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-hover mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="border-0">#</th>
                            <th class="border-0">School</th>
                            <th class="border-0 text-right">{{ count_label }}</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for school in items %}
                            <tr>
                                <td>{{ forloop.counter }}</td>
                                <td><a href="{{ school.get_absolute_url }}">{{ school.name }}</a></td>
                                <td class="text-right font-weight-bold">
                                    {% if value_field == 'total_coty_points' %}
                                        {{ school.total_coty_points|floatformat:1 }}
                                    {% else %}
                                        {{ school.tournament_count }}
                                    {% endif %}
                                </td>
                            </tr>
                        {% empty %}
                            <tr>
                                <td colspan="3" class="text-center text-muted">No data available</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
