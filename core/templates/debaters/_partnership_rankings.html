<div class="row">
    {% for ranking in rankings %}
        <div class="col-md-6 col-lg-4 mb-3">
            <div class="card h-100">
                <div class="card-header">
                    <h3 class="h6 mb-0">{{ forloop.counter }} jump{{ forloop.counter|pluralize }}</h3>
                </div>
                {% if ranking %}
                    <ol class="list-group list-group-flush">
                        {% for debater, count in ranking %}
                            <li class="list-group-item d-flex justify-content-between align-items-baseline">
                                <a href="{{ debater.get_absolute_url }}">{{ debater.name }}</a>
                                <span class="ml-3">{{ count }}</span>
                            </li>
                        {% endfor %}
                    </ol>
                {% else %}
                    <div class="card-body text-muted">No paths of this length.</div>
                {% endif %}
            </div>
        </div>
    {% endfor %}
</div>
