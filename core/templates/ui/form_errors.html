{% if form.non_field_errors %}
  <div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form.hidden_fields %}
  {% if field.errors %}
    <div class="alert alert-danger" role="alert">{{ field.label }} {{ field.errors }}</div>
  {% endif %}
  {{ field }}
{% endfor %}
