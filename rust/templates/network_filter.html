{% if field_name == "qualified" %}
    <div class="form-group">
        <div id="div_id_qualified" class="form-check">
            <input type="checkbox" name="qualified" class="checkboxinput form-check-input" id="id_qualified"{% if filters.qualified %} checked{% endif %}>
            <label for="id_qualified" class="form-check-label">Nationals qualified</label>
        </div>
    </div>
{% else %}
    <div id="div_id_{{ field_name }}" class="form-group">
        <label for="id_{{ field_name }}">{{ label }}</label>
        <div>
            {% if field_name == "schools" %}
                <select name="schools" id="id_schools" class="modelselect2multiple form-control" multiple data-rust-select-url="/core/schools/autocomplete" data-rust-select-placeholder="All schools">
                    {% for id, name in filters.schools %}<option value="{{ id }}" selected>{{ name }}</option>{% endfor %}
                </select>
            {% elif field_name == "min_tournaments" %}
                <input type="number" class="numberinput form-control" name="{{ field_name }}" id="id_{{ field_name }}" min="0" placeholder="0"{% if filters.min_tournaments %} value="{{ filters.min_tournaments }}"{% endif %}>
            {% else %}
                <select name="{{ field_name }}" id="id_{{ field_name }}" class="select form-control"{% if axis %} data-network-axis="{{ axis }}"{% endif %}>
                    {% if axis %}
                        {% for value, label in axis_choices %}<option value="{{ value }}"{% if value == filters[field_name] %} selected{% endif %}>{{ label }}</option>{% endfor %}
                    {% else %}
                        <option value=""{% if not filters[field_name] %} selected{% endif %}>All seasons</option>
                        {% for season in season_choices %}<option value="{{ season }}"{% if season == filters[field_name] %} selected{% endif %}>{{ season }}</option>{% endfor %}
                    {% endif %}
                </select>
            {% endif %}
            {% for error in errors[field_name] %}<p class="invalid-feedback d-block"><strong>{{ error }}</strong></p>{% endfor %}
        </div>
    </div>
{% endif %}
