name: Deploy to Linode

on:
  push:
    branches: [ master ]

# Deploys share a checkout and virtualenv on Linode.
concurrency:
  group: black-rod-linode-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Build the Linux Rust release
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --manifest-path rust/Cargo.toml --release --locked
          npm ci
          npm run build
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/standings-revision"
          tar --dereference --hard-dereference -czf "$RUNNER_TEMP/standings-release.tar.gz" \
            --transform='s|^rust/target/release/black-rod$|black-rod|' \
            --transform='s|^standings-revision$|revision|' \
            rust/target/release/black-rod webpack-stats.json apda/assets rust/static/vendor \
            -C "$RUNNER_TEMP" standings-revision
      - name: Prepare the Rust release on Linode
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          unset SSH_KEY
          ssh-keyscan -T 10 -t ed25519 "$SSH_HOST" > "$ssh_dir/known_hosts"
          fingerprint=$(ssh-keygen -lf "$ssh_dir/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          test "$fingerprint" = 'SHA256:5HeVlb0uLTqSGTsbdfmkp6v3k1rgbK6dviEqjeeilko'
          archive="$RUNNER_TEMP/standings-release.tar.gz"
          checksum=$(sha256sum "$archive" | awk '{print $1}')
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -i "$ssh_dir/key" "root@$SSH_HOST" \
            "/usr/local/sbin/standings-prepare-rust '$GITHUB_SHA' '$checksum'" < "$archive"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          FORUM_PROFILE_API_TOKEN: ${{ secrets.FORUM_PROFILE_API_TOKEN }}
        with:
          envs: FORUM_PROFILE_API_TOKEN
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Shell-native failure handling preserves multiline Python heredocs.
            set -e
            cd /home/rodda/black-rod
            # Update only this integration's key before deploy.sh restarts Django.
            # Never print the token or the rest of the production configuration.
            if [ -n "${FORUM_PROFILE_API_TOKEN:-}" ] && ! venv/bin/python -c 'from dotenv import set_key'; then
              venv/bin/python -m pip install 'python-dotenv==1.2.4'
            fi
            venv/bin/python - <<'PYTHON'
            import os
            import re
            token = os.environ.get("FORUM_PROFILE_API_TOKEN", "")
            if token:
                if not re.fullmatch(r"[a-f0-9]{64}", token):
                    raise SystemExit("Invalid forum integration credential format")
                from dotenv import set_key
                path = os.environ.get("DOT_ENV_FILE", ".env")
                metadata = os.stat(path)
                set_key(path, "FORUM_PROFILE_API_TOKEN", token)
                os.chown(path, metadata.st_uid, metadata.st_gid)
                os.chmod(path, metadata.st_mode & 0o777)
            PYTHON
            ./deploy.sh
            install -m 644 /home/rodda/black-rod/deploy/mittab-results-cache.cron /etc/cron.d/black-rod-mittab-cache
